[workspace]
members = ["mcp"]
default-members = ["mcp"]
resolver = "2"

# Cargo applies patches only at the workspace root. The FST patch and core
# dependency must use the same reviewed canonical engine revision.
[patch.crates-io]
tantivy-fst = { git = "https://github.com/Otzaria/otzaria_search_engine", rev = "4bb3d8e7d11499861ce0655c88841eb23e0f1649" }
tantivy = { git = "https://github.com/Otzaria/tantivy", rev = "130b2682807d2a609d09ba432ba4d0ccc8faf7ed" }
