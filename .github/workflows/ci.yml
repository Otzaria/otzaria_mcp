name: CI

# Runs on every commit (push to any branch) and on PRs. Quality-gates the code,
# then cross-compiles a release binary for every platform we can build natively
# and uploads it as an artifact. Pushing a version tag (v*) also attaches the
# binaries to a GitHub Release.
on:
  push:
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same ref (rapid commits don't pile up).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # needed to attach binaries to a Release on tags

jobs:
  # ── Quality gate: fmt + clippy + tests ──────────────────────────────────────
  check:
    name: fmt · clippy · test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt -p otzaria-mcp --check
      - name: clippy
        # --no-deps: lint only our crate, not the vendored search_engine copy.
        run: cargo clippy --locked -p otzaria-mcp --all-targets --no-deps -- -D warnings
      - name: test
        # The real-data integration tests skip themselves when OTZARIA_TEST_DB is
        # unset (CI has no library), so only the unit/fixture tests run here.
        run: cargo test --locked -p otzaria-mcp

  # ── Cross-platform release binaries ─────────────────────────────────────────
  build:
    name: build (${{ matrix.name }})
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,    target: x86_64-unknown-linux-gnu,  name: linux-x86_64,   ext: "" }
          - { os: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, name: linux-aarch64,  ext: "" }
          # Use current macOS 15 images for Intel and Apple silicon builds.
          - { os: macos-15-intel,   target: x86_64-apple-darwin,       name: macos-x86_64,   ext: "" }
          - { os: macos-15,         target: aarch64-apple-darwin,      name: macos-aarch64,  ext: "" }
          - { os: windows-latest,   target: x86_64-pc-windows-msvc,    name: windows-x86_64, ext: ".exe" }
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Build release binary
        run: cargo build --locked --release -p otzaria-mcp --target ${{ matrix.target }}
      - name: Stage binary
        shell: bash
        run: |
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/otzaria-mcp${{ matrix.ext }}" \
             "dist/otzaria-mcp-${{ matrix.name }}${{ matrix.ext }}"
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: otzaria-mcp-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error
      - name: Attach to Release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
